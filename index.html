<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter Builder — Statutes &amp; Regulations</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  button{font:inherit;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:6px;padding:.42rem .7rem;color:inherit}
  button:hover{background:#f6f3ee}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#701616}
  input,textarea{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:6px;padding:.45rem .55rem;width:100%}
  .app{display:flex;min-height:100vh}
  .sidebar{flex:0 0 16.5rem;width:16.5rem;background:#221f19;color:#eae5db;padding:1rem .8rem 2rem;
           position:sticky;top:0;height:100vh;overflow:auto}
  .brand{font-weight:700}
  .brand span{display:block;font-weight:400;font-size:.76rem;color:#a49c8f}
  .sidebar h2{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:#a49c8f;margin:1.3rem .35rem .5rem}
  .chap-btn{display:block;width:100%;text-align:left;background:transparent;border:0;color:inherit;
            padding:.5rem .55rem;border-radius:6px;line-height:1.3;margin-bottom:2px}
  .chap-btn:hover{background:#322d25}
  .chap-btn.active{background:var(--accent);color:#fff}
  .chap-btn .cn{float:right;font-size:.72rem;opacity:.65}
  .chap-btn .cl{font-weight:600;font-size:.9rem}
  .chap-btn .ct{display:block;font-size:.76rem;opacity:.72}
  .sidebar .empty{color:#8f887c;font-size:.8rem;padding:.3rem .55rem;line-height:1.45}
  .side-actions{margin-top:1.4rem;display:flex;gap:.4rem;flex-wrap:wrap}
  .side-actions button{background:#2f2a22;border-color:#443d32;color:#eae5db;font-size:.8rem;padding:.35rem .55rem}
  .side-actions button:hover{background:#3b352b}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .composer{background:#fff;border-bottom:1px solid var(--line);padding:1rem 1.15rem .9rem}
  .composer label.top{display:block;font-size:.78rem;font-weight:600;margin-bottom:.35rem;color:var(--muted)}
  #paste{min-height:8rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;white-space:pre;overflow-wrap:normal;overflow-x:auto}
  .fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;margin-top:.6rem}
  .fields label{font-size:.7rem;color:var(--muted);display:block}
  .fields input{font-size:.85rem;padding:.35rem .45rem}
  .detect{font-size:.74rem;color:var(--muted);margin-top:.5rem;min-height:1.1em}
  .composer-row{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap;margin-top:.6rem}
  .composer-row .spacer{flex:1}
  .doc{padding:1.4rem 1.6rem 3rem;max-width:60rem;width:100%}
  .empty-note{color:var(--muted)}
  #toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:#2a2620;color:#fff;
         padding:.55rem .9rem;border-radius:8px;font-size:.86rem;opacity:0;pointer-events:none;transition:opacity .18s;z-index:50}
  #toast.show{opacity:1}
  @media (max-width:720px){.fields{grid-template-columns:1fr 1fr}.sidebar{flex-basis:12rem;width:12rem}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Chapter Builder<span>Statutes &amp; Regulations</span></div>
    <h2>Chapters</h2>
    <div id="chapters"></div>
    <div class="side-actions">
      <button type="button" id="xOne">Export chapter</button>
      <button type="button" id="xAll">Export all</button>
      <button type="button" id="sample">Load sample</button>
      <button type="button" id="clear">Clear all</button>
    </div>
  </aside>

  <main class="main">
    <div class="composer">
      <label class="top" for="paste">Paste a section of a statute or regulation</label>
      <textarea id="paste" placeholder="Paste one section here, e.g.&#10;§ 7-12. Rate filings&#10;(a) Every public utility shall ...&#10;    (1) ..."></textarea>
      <div class="fields">
        <label>Chapter (override)<input id="chNum" placeholder="auto"></label>
        <label>Chapter title<input id="chTitle" placeholder="auto"></label>
        <label>Section number<input id="secNum" placeholder="auto"></label>
        <label>Section title<input id="secTitle" placeholder="auto"></label>
      </div>
      <div class="detect" id="detect"></div>
      <div class="composer-row">
        <button type="button" class="primary" id="add">Add section</button>
        <span class="spacer"></span>
      </div>
    </div>
    <div class="doc" id="sections"></div>
  </main>
</div>
<div id="toast"></div>

<script>
"use strict";

/* ---------- shared document styles (used on-screen and in exports) ---------- */
const DOC_CSS = `
:root{ --bg:#efece6; --ink:#1c1a17; --muted:#6f675d; --line:#ddd6ca; --accent:#8a1c1c; --hl:#ffe9a8; }
.doc .page{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:2rem 2.4rem; max-width:52rem; }
.doc .chapter-head{ margin:0 0 .2rem; font-size:1.1rem; color:var(--ink); }
.doc .chapter-sub{ color:var(--muted); font-size:.85rem; margin:0 0 1.6rem; }
.doc .sect{ margin:0 0 1.2rem; }
.doc .sect-head{ font-size:15px; margin:.2rem 0 .5rem; color:var(--ink); }
.doc .sect-body{ }
.doc .clause{ margin:.2rem 0; }
.doc .clause-num{ font-weight:700; margin-right:.35rem; }
.doc .blank{ height:.55rem; }
mark.term{ background:var(--hl); color:inherit; border-radius:3px; padding:0 2px; }
.doc-export{ background:#efece6; margin:0; padding:2.5rem 1rem; }
.doc-export .page{ margin:0 auto; }
`;
(function(){ const s=document.createElement("style"); s.textContent=DOC_CSS; document.head.appendChild(s); })();

/* ---------- tiny utils ---------- */
const $ = (id)=>document.getElementById(id);
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a; }
function indentOf(line){ let n=0; for(const ch of line){ if(ch===" ") n+=1; else if(ch==="\t") n+=4; else break; } return n; }

let toastTimer=null;
function toast(msg, kind){
  const t=$("toast"); t.textContent=msg;
  t.style.background = kind==="warn" ? "#7a4a12" : kind==="err" ? "#8a1c1c" : "#2a2620";
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"), 2600);
}

/* Natural ordering: numbers compared numerically, text case-insensitively */
function naturalKey(v){
  return String(v==null?"":v).split(/(\d+)/).filter(x=>x!=="")
    .map(t=>/^\d+$/.test(t) ? t.padStart(12,"0") : t.toLowerCase());
}
function naturalCmp(a,b){
  const A=naturalKey(a), B=naturalKey(b), n=Math.max(A.length,B.length);
  for(let i=0;i<n;i++){ const x=A[i]===undefined?"":A[i], y=B[i]===undefined?"":B[i];
    if(x<y) return -1; if(x>y) return 1; }
  return 0;
}

/* ---------- state + storage (never let storage throw) ---------- */
const STORE_KEY = "chapterBuilder.v1";
let state = { chapters: [], activeKey: null };

function load(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* sandboxed/file:// — ignore */ }
}

/* ---------- parsing ---------- */
const CHAPTER_RE = /^\s*(?:CHAPTER|Chapter|CH\.|Ch\.)\s+([0-9IVXLCivxlc][0-9A-Za-z.\-]*)\b\s*[—–\-:.]?\s*(.*)$/;
const SECTION_RE = /^\s*(?:§+\s*|Section\s+|Sec\.\s+)?([0-9]+[A-Za-z]*(?:[.\-][0-9A-Za-z]+)*)\s*[.):]?\s*(.*)$/;

function parseSection(text){
  const lines = String(text).replace(/\r\n?/g,"\n").split("\n");
  while(lines.length && !lines[0].trim()) lines.shift();
  while(lines.length && !lines[lines.length-1].trim()) lines.pop();

  let chapterNumber="", chapterTitle="";
  for(let i=0;i<lines.length;i++){
    if(!/^\s*(?:CHAPTER|Chapter|CH\.|Ch\.)/.test(lines[i])) continue;
    const m=lines[i].match(CHAPTER_RE);
    if(m){ chapterNumber=m[1]; chapterTitle=(m[2]||"").replace(/\s*[.]\s*$/,"").trim(); lines.splice(i,1); break; }
  }

  let number="", title="";
  for(let i=0;i<Math.min(lines.length,3);i++){
    const m=lines[i].match(SECTION_RE);
    if(m && m[1]){
      number=m[1];
      title=(m[2]||"").replace(/\s*[.]?\s*$/,"").trim();
      lines.splice(i,1);
      break;
    }
  }
  const body=lines.join("\n").replace(/\n{3,}/g,"\n\n").trim();
  return { chapterNumber, chapterTitle, number, title, body };
}

/* Definition detection + term extraction (conservative) */
const TERM_QUOTED = /[\u201C\u201D"']([^"\u201C\u201D\u2018\u2019']{1,60}?)[\u201C\u201D\u2018\u2019"']\s*(?:means|shall mean|includes|include|refers to|has the meaning)/gi;
const TERM_CAPS   = /\b([A-Z][A-Za-z]*(?:\s+[A-Z][A-Za-z]*){0,3})\s+(?:means|shall mean)\b/g;

function extractTerms(body){
  const out=[]; let m;
  TERM_QUOTED.lastIndex=0;
  while((m=TERM_QUOTED.exec(body))!==null){ const t=m[1].trim(); if(t.length>=2) out.push(t); }
  TERM_CAPS.lastIndex=0;
  while((m=TERM_CAPS.exec(body))!==null){ const t=m[1].trim(); if(t.length>=2 && !/^(The|A|An|It|This|That|Such)$/i.test(t)) out.push(t); }
  return out;
}
function isDefinitionSection(sec){
  if(/definition/i.test(sec.title||"")) return true;
  const hits=(sec.body.match(/[\u201C\u201D"'][^"\u201C\u201D\u2018\u2019']{1,60}[\u201C\u201D\u2018\u2019"']\s*(?:means|shall mean|includes|refers to)/gi)||[]).length;
  return hits>=2;
}

/* ---------- highlighting (whole chapter, runs on every render) ---------- */
function chapterDefinitions(ch){
  const set=new Set();
  for(const s of ch.sections){
    if(!isDefinitionSection(s)) continue;
    for(const t of extractTerms(s.body)) set.add(t);
  }
  return Array.from(set);
}
function buildTermRegex(terms){
  const parts=terms.slice().sort((a,b)=>b.length-a.length).map(t=>escapeRe(t).replace(/\s+/g,"\\s+"));
  if(!parts.length) return null;
  return new RegExp("(?<![A-Za-z0-9])(?:"+parts.join("|")+")(?![A-Za-z0-9])","g");
}
function highlightTerms(root, terms){
  const re=buildTermRegex(terms);
  if(!re) return;
  const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  for(const node of nodes){
    const value=node.nodeValue;
    re.lastIndex=0;
    if(!re.test(value)) continue;
    re.lastIndex=0;
    const frag=document.createDocumentFragment();
    let last=0, m;
    while((m=re.exec(value))!==null){
      if(m[0].length===0){ re.lastIndex++; continue; }
      if(m.index>last) frag.appendChild(document.createTextNode(value.slice(last,m.index)));
      frag.appendChild(el("mark","term",m[0]));
      last=m.index+m[0].length;
    }
    if(last<value.length) frag.appendChild(document.createTextNode(value.slice(last)));
    node.parentNode.replaceChild(frag,node);
  }
}

/* ---------- clause nesting: follow the source ---------- */
function isRoman(s){ return /^[ivxlcdm]+$/i.test(s) && /^(?=[MDCLXVI])M*(C[MD]|D?C{0,3})(X[CL]|L?X{0,3})(I[XV]|V?I{0,3})$/i.test(s); }
function romanVal(s){
  const map={i:1,v:5,x:10,l:50,c:100,d:500,m:1000};
  const t=s.toLowerCase(); let n=0;
  for(let i=0;i<t.length;i++){ const v=map[t[i]], next=map[t[i+1]]||0; n += v<next ? -v : v; }
  return n;
}
function predecessor(s){
  if(/^\d+$/.test(s)) return String(Number(s)-1);
  if(/^[a-z]$/.test(s) && s>"a") return String.fromCharCode(s.charCodeAt(0)-1);
  if(/^[A-Z]$/.test(s) && s>"A") return String.fromCharCode(s.charCodeAt(0)-1);
  if(s.length>1 && isRoman(s)){ const v=romanVal(s); return v>1 ? romanValToStr(v-1) : null; }
  return null;
}
function romanValToStr(n){
  const table=[[1000,"m"],[900,"cm"],[500,"d"],[400,"cd"],[100,"c"],[90,"xc"],[50,"l"],[40,"xl"],[10,"x"],[9,"ix"],[5,"v"],[4,"iv"],[1,"i"]];
  let out=""; for(const [v,s] of table){ while(n>=v){ out+=s; n-=v; } } return out;
}
function markerDepth(label, stack){
  const inner=label.replace(/[()]/g,"").replace(/[.)]$/,"");
  const seen=stack.lastIndexOf(inner);            /* exact repeat -> pop back to it */
  if(seen!==-1){ stack.length=seen+1; return seen+1; }
  const pred=predecessor(inner);                  /* sequence continuation -> same level */
  if(pred!==null){ const pi=stack.lastIndexOf(pred); if(pi!==-1){ stack.length=pi+1; stack[pi]=inner; return pi+1; } }
  stack.push(inner);                              /* first appearance -> one deeper */
  return stack.length;
}

function renderBody(body, defs){
  const container=el("div","sect-body");
  const lines=String(body).split("\n");
  const entries=lines.map(l=>({ text:l.replace(/^\s+/,""), indent:indentOf(l) }));
  const nonEmpty=entries.filter(e=>e.text);

  let useIndent=false, unit=0;
  if(nonEmpty.length){
    const base=Math.min.apply(null, nonEmpty.map(e=>e.indent));
    if(nonEmpty.some(e=>e.indent>base)){
      let g=0; for(const e of nonEmpty){ const d=e.indent-base; if(d>0) g=g?gcd(g,d):d; }
      if(g>=2){ useIndent=true; unit=g; }
      entries.forEach(e=>{ e.depth0=(e.indent-base); });
    }
  }

  const stack=[];                 /* for marker mode */
  let prevDepth=0;

  for(const e of entries){
    if(!e.text){ container.appendChild(el("div","blank")); continue; }

    const mm=e.text.match(/^(\((?:\d+|[A-Za-z]{1,5})\)|[A-Za-z0-9]{1,5}[.)])(?=\s|$)/);
    let depth;
    if(useIndent) depth=Math.max(0, Math.round(e.depth0/unit));
    else if(mm)   depth=markerDepth(mm[1], stack);
    else          depth=prevDepth;
    prevDepth=depth;

    const p=el("div","clause");
    p.style.paddingLeft=(depth*1.5)+"rem";

    let rest=e.text;
    if(mm){
      p.appendChild(el("b","clause-num",mm[1]));   /* marker printed ONCE, bold */
      rest=e.text.slice(mm[1].length).replace(/^\s+/,"");  /* and removed from the body */
    }
    const span=el("span",null,rest);
    p.appendChild(span);
    if(defs.length) highlightTerms(span, defs);

    container.appendChild(p);
  }
  return container;
}

/* ---------- rendering ---------- */
function currentChapter(){ return state.chapters.find(c=>c.key===state.activeKey) || state.chapters[0] || null; }

function renderChapterContent(ch){
  const page=el("div","page");
  page.appendChild(el("h3","chapter-head","Chapter "+ch.key + (ch.title ? " — "+ch.title : "")));
  page.appendChild(el("p","chapter-sub", ch.sections.length+" section"+(ch.sections.length===1?"":"s")+" · auto-sorted"));
  const defs=chapterDefinitions(ch);
  for(const s of ch.sections) page.appendChild(renderSection(s, defs));
  return page;
}
function renderSection(sec, defs){
  const wrap=el("section","sect");
  let head="";
  if(sec.number) head="§ "+sec.number+(sec.title ? ". "+sec.title : "");
  else head=sec.title || "(untitled section)";
  wrap.appendChild(el("h4","sect-head",head));
  wrap.appendChild(renderBody(sec.body, defs));
  return wrap;
}

function renderSidebar(){
  const host=$("chapters"); host.innerHTML="";
  const list=state.chapters.slice().sort((a,b)=>naturalCmp(a.key,b.key));
  if(!list.length){ host.appendChild(el("p","empty","No chapters yet.")); return; }
  for(const ch of list){
    const btn=el("button","chap-btn"+(ch.key===state.activeKey?" active":""));
    btn.type="button";
    btn.appendChild(el("span","cn", ch.sections.length+" §"));
    btn.appendChild(el("span","cl", "Chapter "+ch.key));
    if(ch.title) btn.appendChild(el("span","ct", ch.title));
    btn.addEventListener("click", ()=>{ state.activeKey=ch.key; save(); renderActive(); });
    host.appendChild(btn);
  }
}
function renderActive(){
  renderSidebar();
  const host=$("sections"); host.innerHTML="";
  const ch=currentChapter();
  if(!ch){ host.appendChild(el("p","empty-note","No chapters yet — paste a section above and click “Add section”.")); return; }
  host.appendChild(renderChapterContent(ch));
}

/* ---------- actions ---------- */
function onAdd(){
  const text=$("paste").value.trim();
  if(!text){ toast("Paste a section first.","warn"); return; }
  const p=parseSection(text);

  const chapterNumber=($("chNum").value.trim() || p.chapterNumber || state.activeKey || "Uncategorized");
  const chapterTitle =($("chTitle").value.trim() || p.chapterTitle || "");
  const number=($("secNum").value.trim() || p.number || "");
  const title =($("secTitle").value.trim() || p.title || "");
  const body  =p.body || text;

  let ch=state.chapters.find(c=>c.key===chapterNumber);
  if(!ch){ ch={ key:chapterNumber, title:chapterTitle, sections:[] }; state.chapters.push(ch); }
  else if(chapterTitle && !ch.title){ ch.title=chapterTitle; }

  if(number && ch.sections.some(s=>s.number===number)){
    state.activeKey=ch.key; save(); renderActive();
    toast("Section "+number+" is already in Chapter "+ch.key+".","warn");
    return;
  }

  ch.sections.push({ id:uid(), number, title, body });
  ch.sections.sort((a,b)=>naturalCmp(a.number,b.number));
  state.activeKey=ch.key;
  save();
  $("paste").value=""; $("chNum").value=""; $("chTitle").value=""; $("secNum").value=""; $("secTitle").value="";
  $("detect").textContent="";
  renderActive();
  toast("Added "+(number ? "§ "+number : "section")+" to Chapter "+ch.key+".","ok");
}

function exportChapter(ch){
  const page=renderChapterContent(ch);
  const docTitle="Chapter "+ch.key+(ch.title ? " — "+ch.title : "");
  const html="<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n"+
    "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>"+escapeHtml(docTitle)+"</title>\n"+
    "<style>"+DOC_CSS+"</style></head>\n<body class=\"doc-export\">\n<div class=\"doc\">"+page.outerHTML+"</div>\n</body></html>";
  download(html, "chapter-"+String(ch.key).replace(/[^A-Za-z0-9._-]/g,"_")+".html");
}
function download(html, name){
  const blob=new Blob([html],{type:"text/html"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ---------- sample data (shows both fixes) ---------- */
function sampleData(){
  return { activeKey:"7", chapters:[
    { key:"7", title:"Public Utilities", sections:[
      { id:uid(), number:"7-4", title:"Certificates",
        body:"The authority may issue a certificate of public convenience and necessity only after notice and a hearing." },
      { id:uid(), number:"7-1", title:"Application",
        body:"This chapter applies to every public utility that receives a certificate of public convenience and necessity.\n(a) The authority shall review each application within 60 days.\n    (1) The authority may request additional information.\n    (2) A decision must issue within the period stated.\n(b) An applicant may appeal a denial as provided in section 7-9." },
      { id:uid(), number:"7-3", title:"Rate filings",
        body:"(a) Every public utility shall file its rates with the authority.\n(1) A filing must state the net income for the preceding year.\n(2) The authority shall accept or reject each filing within 90 days." },
      { id:uid(), number:"7-2", title:"Definitions",
        body:"As used in this chapter:\n\u201CAuthority\u201D means the Department of Public Utilities.\n\u201CNet income\u201D means gross income less allowable deductions.\n\u201CCertificate of public convenience and necessity\u201D means an authorization issued under section 7-4." }
    ]},
    { key:"12", title:"Taxation", sections:[
      { id:uid(), number:"12-1", title:"Imposition", body:"A tax is imposed on the net income of every resident." }
    ]}
  ]};
}

/* ---------- wire up ---------- */
$("add").addEventListener("click", onAdd);
$("paste").addEventListener("input", ()=>{
  const v=$("paste").value.trim();
  if(!v){ $("detect").textContent=""; return; }
  const p=parseSection(v);
  $("detect").textContent="Detected — Chapter: "+(p.chapterNumber||"—")+" · Section: "+(p.number||"—")+" · Title: "+(p.title||"—");
});
$("xOne").addEventListener("click", ()=>{ const ch=currentChapter(); if(!ch){ toast("Nothing to export.","warn"); return; } exportChapter(ch); });
$("xAll").addEventListener("click", ()=>{ if(!state.chapters.length){ toast("Nothing to export.","warn"); return; } for(const ch of state.chapters) exportChapter(ch); });
$("sample").addEventListener("click", ()=>{ state=sampleData(); save(); renderActive(); toast("Sample loaded.","ok"); });
$("clear").addEventListener("click", ()=>{
  if(!state.chapters.length) return;
  if(!confirm("Delete all chapters and sections? This cannot be undone.")) return;
  state={ chapters:[], activeKey:null }; save(); renderActive();
});

(function init(){
  const saved=load();
  if(saved && Array.isArray(saved.chapters)) state=saved;
  renderActive();
})();
</script>
</body>
</html>
