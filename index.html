<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter Builder — Statutes &amp; Regulations</title>
<!-- doc.css is linked (used on screen) and also inlined into exports by src/export/html.js -->
<link rel="stylesheet" href="styles/doc.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Chapter Builder<span>Statutes &amp; Regulations</span></div>
    <h2>Jurisdictions</h2>
    <div id="chapters"></div>
    <div class="side-actions">
      <button type="button" id="addJurisdiction">Add jurisdiction</button>
      <button type="button" id="xOne">Export chapter</button>
      <button type="button" id="xAll">Export all</button>
      <button type="button" id="sample">Load sample</button>
      <button type="button" id="clear">Clear all</button>
    </div>
  </aside>

  <main class="main">
    <div class="composer">
      <label class="top" for="paste">Paste the statute or regulation text — the wording only</label>
      <textarea id="paste" placeholder="Paste only the wording of the statute or regulation here. Do not include the section number, the section title, or the chapter heading — enter those in the fields below.&#10;&#10;Everything you paste is used as this section's text.&#10;&#10;e.g.&#10;(a) Every public utility shall file its rates with the authority.&#10;    (1) A filing must state the net income for the preceding year."></textarea>
      <div class="fields">
        <label>Jurisdiction<select id="jurisdiction"></select></label>
        <label><span id="chTitleLabel">Chapter title</span><input id="chTitle" placeholder="defaults to UNKNOWN"></label>
        <label><span id="secNumLabel">Section number *</span><input id="secNum" placeholder="e.g. 7-12" aria-required="true"></label>
        <label>Section title<input id="secTitle" placeholder="defaults to UNKNOWN"></label>
      </div>
      <div class="org" id="parts"></div>
      <div class="hint" id="hint"></div>
      <div class="composer-row">
        <button type="button" class="primary" id="add">Add section</button>
        <span class="spacer"></span>
      </div>
    </div>
    <div class="doc" id="sections"></div>
  </main>
</div>
<div id="toast"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
